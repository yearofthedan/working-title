name: Mutation

on:
  pull_request:
    branches: [main]
  # A pull request's cache is scoped to its own merge ref, so only a run on main seeds the next pull
  # request's (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache).
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # A run reuses results whatever changes in the files it reads, so those are in the key
      # (https://stryker-mutator.io/docs/stryker-js/incremental); `hashFiles` cannot sit in a
      # workflow-level `env`.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: incremental
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts', 'tsconfig.json', '.node-version', 'src/**', '!src/domain/**', '!src/application/**', '!src/**/*.test.ts') }}-${{ github.sha }}
          restore-keys: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts', 'tsconfig.json', '.node-version', 'src/**', '!src/domain/**', '!src/application/**', '!src/**/*.test.ts') }}-
      - run: ./do mutate
      # Saved apart from the restore: the cache action saves only on success, and a failing run's
      # results are worth keeping (https://github.com/actions/cache/blob/main/action.yml).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.incremental.outputs.cache-hit != 'true'
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts', 'tsconfig.json', '.node-version', 'src/**', '!src/domain/**', '!src/application/**', '!src/**/*.test.ts') }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: report
        # A failed run still hands over the report that says which mutants survived.
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
      - if: always() && steps.report.outputs.artifact-url != ''
        run: |
          echo "Mutation report: ${{ steps.report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
