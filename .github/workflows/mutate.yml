name: Mutation

on:
  pull_request:
    branches: [main]
  # A cache a pull request run writes is scoped to that pull request's merge ref, so the
  # incremental file reaches the next pull request only from a run on main
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache).
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # The most recent file written under these dependencies and configs, and this commit's own
      # where it is a rerun (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#cache-key-matching).
      # They are in the key because Stryker detects a change to neither, and would reuse results the
      # change invalidated (https://stryker-mutator.io/docs/stryker-js/incremental). `hashFiles` is
      # available here and not in a workflow-level `env`
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts') }}-
      # No score fails a run: which mutants survive is what the report is for, and the threshold
      # waits on a baseline of real numbers (https://github.com/yearofthedan/working-title/issues/21).
      - run: ./do mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: report
        # The report is what says which mutants survived, so a run that failed still hands it over.
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
      - if: always() && steps.report.outputs.artifact-url != ''
        run: |
          echo "Mutation report: ${{ steps.report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
