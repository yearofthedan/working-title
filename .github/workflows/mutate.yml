name: Mutation

on:
  pull_request:
    branches: [main]
  # A cache a pull request run writes is scoped to that pull request's merge ref, so the
  # incremental file reaches the next pull request only from a run on main
  # (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#restrictions-for-accessing-a-cache).
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # The lockfile and the configs a run reads are in the key: Stryker carries results forward
      # whatever changes in them (https://stryker-mutator.io/docs/stryker-js/incremental). The most
      # recent file written under the same ones is what a restore picks up, and this commit's own
      # where it is a rerun
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching#cache-key-matching).
      # `hashFiles` works in a step, where a workflow-level `env` allows no function
      # (https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: mutation-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'stryker.vitest.config.ts', 'vite.config.ts') }}-
      # A run whose score falls under the threshold fails, and the ruleset on main does not require
      # this job, so it reports without blocking a merge.
      - run: ./do mutate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: report
        # The report is what says which mutants survived, so a run that failed still hands it over.
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
      - if: always() && steps.report.outputs.artifact-url != ''
        run: |
          echo "Mutation report: ${{ steps.report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
