name: Coverage

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event.pull_request.number }}
  # One run per pull request at a time, so the run that starts next finds the comment the one before
  # it posted (https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency).
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shell suite that runs `./do check` in a copy audits the lockfile against the base
      # branch, which a one-commit checkout does not have.
      - run: git fetch --depth=1 origin "$GITHUB_BASE_REF"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: ./do coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/summary.txt

  comment:
    needs: coverage
    # A fork's token cannot write, and this job would only fail (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflows-in-forked-repositories).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A job-level `permissions` block replaces the workflow's, and downloading the artifact needs
    # the Actions permission (https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens#repository-permissions-for-actions).
    permissions:
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name coverage-summary --dir summary
      - run: |
          set -eu
          marker='<!-- coverage-report -->'
          table=$(find summary -name summary.txt -print -quit)
          totals=$(grep -m1 '^All files' "$table")
          artifact="Download the coverage-report artifact from this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '%s\n\n## Coverage report\n\n```\n%s\n```\n\nRead the line and branch columns.\n\n%s\n' \
            "$marker" "$(cat "$table")" "$artifact")
          if [ "$(printf '%s' "$body" | wc -c)" -gt 65536 ]; then
            body=$(printf '%s\n\n## Coverage report\n\n```\n%s\n```\n\nThe table is too long for a comment, so this is the totals row.\n\nRead the line and branch columns.\n\n%s\n' \
              "$marker" "$totals" "$artifact")
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
