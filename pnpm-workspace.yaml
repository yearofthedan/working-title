# The catalog (https://pnpm.io/catalogs) holds the vite-plus version and a vite
# alias for the Vite+ core, and the override
# (https://pnpm.io/settings/dependency-resolution#overrides) points every vite
# import at that alias, so dependencies get the copy Vite+ bundles
# (https://viteplus.dev/guide/local-cli#manual-installation). An upgrade changes
# both catalog entries together (https://viteplus.dev/guide/upgrade-project).
overrides:
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
# The peer rule (https://pnpm.io/settings/peer-dependencies#peerdependencyrules)
# accepts any vite version, because the core's own version number falls outside
# the ranges other packages ask for. A dependency that needs a newer Vite than
# Vite+ bundles is not warned about.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
# A release younger than three days is not resolved, the same span Renovate waits
# before it offers one (renovate.json), so a version withdrawn as compromised does
# not reach a machine
# (https://pnpm.io/settings/dependency-resolution#minimumreleaseage). Setting a cutoff
# at all also makes it strict (minimumReleaseAgeStrict), so a dependency with no
# version in range old enough fails the install instead of falling back to a young one.
minimumReleaseAge: 4320
# A release whose publisher trust is weaker than an earlier release's is refused, which
# is what a hijacked account publishing under a package's name looks like
# (https://pnpm.io/settings/dependency-resolution#trustpolicy).
trustPolicy: no-downgrade
# The two releases the trust check refuses, and why each one stays:
# @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1 is the only release of that
# plugin workbox-build@7.4.1 accepts, and Babel 7, reached through workbox-build,
# requires semver@6.3.1. The check objects to both because a release of each published
# earlier carries a provenance attestation and these two do not.
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  - semver@6.3.1
