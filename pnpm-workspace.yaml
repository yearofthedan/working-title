# The catalog (https://pnpm.io/catalogs) holds the vite-plus version and a vite
# alias for the Vite+ core, and the override
# (https://pnpm.io/settings/dependency-resolution#overrides) points every vite
# import at that alias, so dependencies get the copy Vite+ bundles
# (https://viteplus.dev/guide/local-cli#manual-installation). An upgrade changes
# both catalog entries together (https://viteplus.dev/guide/upgrade-project).
overrides:
  vite@*: 'catalog:'
  # shortcut: typed-rest-client pins qs at 6.15.1, which carries three advisories
  # (https://github.com/advisories/GHSA-4mjr-xmp4-gh2g); drop the override when that package asks
  # for ^6.16.0, as its 3.1.1 does.
  qs@*: 6.16.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
# The peer rule (https://pnpm.io/settings/peer-dependencies#peerdependencyrules)
# accepts any vite version, because the core's own version number falls outside
# the ranges other packages ask for. A dependency that needs a newer Vite than
# Vite+ bundles is not warned about.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# dependency-cruiser reads TypeScript through the compiler's JavaScript API, which needs a
# `typescript` below 7, and Stryker's tsconfig rewrite does the same, while the project's own is 7;
# each carries one of its own (https://pnpm.io/settings/package-extensions).
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
  '@stryker-mutator/core':
    dependencies:
      typescript: 6.0.3

# Three days, the span Renovate waits, so a release withdrawn as compromised does not
# reach a machine (https://pnpm.io/settings/dependency-resolution#minimumreleaseage).
minimumReleaseAge: 4320
# Refuse a release weaker in publisher trust than an earlier release, which is what a
# hijacked account publishing looks like (https://pnpm.io/settings/dependency-resolution#trustpolicy).
trustPolicy: no-downgrade
# Why each stays: no other release of @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1
# works for workbox-build@7.4.1, and Babel 7 requires semver@6.3.1.
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  - semver@6.3.1
# shortcut: this runner joins a test's name chain with a space, where Vitest 5 matches a per-test
# filter on ' > ', so a covered mutant runs no tests and is reported survived
# (https://github.com/stryker-mutator/stryker-js/issues/6210); drop the patch when a release carries
# the fix, since pnpm fails the install on an unused one (https://pnpm.io/cli/patch#allowunusedpatches).
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
