overrides:
  vite@*: 'catalog:'
  # shortcut: Stryker's core asks for typed-rest-client ~2.3.0, which pins qs at 6.15.1, and that
  # version carries three advisories (https://github.com/advisories/GHSA-4mjr-xmp4-gh2g); drop the
  # override when the core takes a typed-rest-client that allows 6.16.0, as 3.1.1 does.
  qs@*: 6.16.1
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
# The peer rule (https://pnpm.io/settings/peer-dependencies#peerdependencyrules)
# accepts any vite version, because the core's own version number falls outside
# the ranges other packages ask for. A dependency that needs a newer Vite than
# Vite+ bundles is not warned about.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# dependency-cruiser reads TypeScript through the compiler's JavaScript API, which needs a
# `typescript` below 7, and Stryker's tsconfig rewrite does the same, while the project's own is 7;
# each carries one of its own (https://pnpm.io/settings#packageextensions).
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
  '@stryker-mutator/core':
    dependencies:
      typescript: 6.0.3

# Three days, the span Renovate waits, so a release withdrawn as compromised does not
# reach a machine (https://pnpm.io/settings/dependency-resolution#minimumreleaseage).
minimumReleaseAge: 4320
# Refuse a release weaker in publisher trust than an earlier release, which is what a
# hijacked account publishing looks like (https://pnpm.io/settings/dependency-resolution#trustpolicy).
trustPolicy: no-downgrade
# Why each stays: no other release of @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1
# works for workbox-build@7.4.1, and Babel 7 requires semver@6.3.1.
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  - semver@6.3.1
minimumReleaseAgeExclude:
  # Renovate security update: qs@6.16.1
  - qs@6.16.1
