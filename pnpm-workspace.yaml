# The catalog (https://pnpm.io/catalogs) holds the vite-plus version and a vite
# alias for the Vite+ core, and the override
# (https://pnpm.io/settings/dependency-resolution#overrides) points every vite
# import at that alias, so dependencies get the copy Vite+ bundles
# (https://viteplus.dev/guide/local-cli#manual-installation). An upgrade changes
# both catalog entries together (https://viteplus.dev/guide/upgrade-project).
overrides:
  vite@*: 'catalog:'
  # The qs that Stryker's typed-rest-client pins, 6.15.1, carries three advisories, and the
  # override is what moves it: 6.16.0 is the first release clear of all three
  # (https://github.com/advisories/GHSA-4mjr-xmp4-gh2g). The package pins that version exactly,
  # so it changes nothing on its own. Drop this when it asks for ^6.16.0, as its 3.x line does.
  qs@*: 6.16.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
# The peer rule (https://pnpm.io/settings/peer-dependencies#peerdependencyrules)
# accepts any vite version, because the core's own version number falls outside
# the ranges other packages ask for. A dependency that needs a newer Vite than
# Vite+ bundles is not warned about.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# dependency-cruiser reads TypeScript only through a `typescript` below 7, and the project's own
# is 7, so the check carries one of its own rather than hold the toolchain back
# (https://pnpm.io/settings/package-extensions).
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3

# Three days, the span Renovate waits, so a release withdrawn as compromised does not
# reach a machine (https://pnpm.io/settings/dependency-resolution#minimumreleaseage).
minimumReleaseAge: 4320
# Refuse a release weaker in publisher trust than an earlier release, which is what a
# hijacked account publishing looks like (https://pnpm.io/settings/dependency-resolution#trustpolicy).
trustPolicy: no-downgrade
# Why each stays: no other release of @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1
# works for workbox-build@7.4.1, and Babel 7 requires semver@6.3.1.
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  - semver@6.3.1
# The patch joins a test's name chain with ' > ', which is what Vitest 5 matches a
# per-test filter against; without it every mutant with per-test coverage runs no tests
# and is reported survived (https://github.com/stryker-mutator/stryker-js/issues/6210).
# Drop it when a release carries the fix: the pin below keeps the patch applied, and pnpm
# refuses an unused one, so bumping the runner fails the install until they change together
# (https://pnpm.io/cli/patch#allowunusedpatches).
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
